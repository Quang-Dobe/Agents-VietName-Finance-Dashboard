name: Auto-merge PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --delete-branch \
            "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
      - name: Trigger Pages deploy
        # Merge commit above was pushed with GITHUB_TOKEN, so pages.yml's
        # `on: push` never fires (GitHub Actions anti-recursion rule).
        # workflow_dispatch is exempt from that rule, so dispatch it explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
